<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/avif" href="/TrusserLOGO.avif" />
  <link rel="canonical" href="https://trusser.in/" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Eco-friendly stationery & lifestyle products crafted from recycled bottles. Sustainable gifts, corporate gifting, and everyday essentials—made in Bengaluru, India." />
  <meta name="robots" content="index,follow" />
  <meta name="theme-color" content="#1A3C27" />

  <!-- Open Graph / Twitter -->
  <meta property="og:site_name" content="Trussers" />
  <meta property="og:title" content="Trussers | Sustainable Premium Goods" />
  <meta property="og:description"
    content="Eco-friendly stationery & lifestyle products crafted from recycled bottles. Sustainable gifts, corporate gifting, and everyday essentials—made in Bengaluru, India." />
  <meta property="og:url" content="https://trusser.in/" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://trusser.in/heroimage.webp" />
  <meta property="og:image:alt" content="Trussers — Sustainable premium goods" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Trussers | Sustainable Premium Goods" />
  <meta name="twitter:description"
    content="Eco-friendly stationery & lifestyle products crafted from recycled bottles. Sustainable gifts, corporate gifting, and everyday essentials—made in Bengaluru, India." />
  <meta name="twitter:image" content="https://trusser.in/heroimage.webp" />

  <!-- Structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://trusser.in/#organization",
          "name": "Trussers",
          "url": "https://trusser.in/",
          "logo": "https://trusser.in/trusser-logo.avif",
          "sameAs": [
            "https://instagram.com/trusser.in"
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://trusser.in/#website",
          "url": "https://trusser.in/",
          "name": "Trussers",
          "publisher": { "@id": "https://trusser.in/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://trusser.in/shop?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "LocalBusiness",
          "@id": "https://trusser.in/#localbusiness",
          "name": "Trussers",
          "url": "https://trusser.in/",
          "image": "https://trusser.in/heroimage.webp",
          "telephone": "+91 9008138404",
          "email": "info@trusser.in",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "No 5, 12th Cross Road, Cubbonpet",
            "addressLocality": "Bengaluru",
            "addressRegion": "Karnataka",
            "postalCode": "560002",
            "addressCountry": "IN"
          },
          "areaServed": [
            "Bengaluru",
            "Chickpet"
          ]
        }
      ]
    }
  </script>
  <title>Trussers | Sustainable Premium Goods</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
